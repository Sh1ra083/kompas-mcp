name: Windows source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install locked environment
        run: |
          python -m pip install -r requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Unit tests without CAD
        run: python -m pytest tests -q
      - name: Verify publication files and API schemas
        run: |
          python scripts/publication_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/export_schemas.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- src/kompas_mcp/schemas.json
      - name: Build wheel and Windows application
        run: ./build.ps1 -Python (Get-Command python).Source
      - name: Packaged MCP smoke test without CAD
        run: python tests/integration/package_smoke.py dist/kompas-mcp/kompas-mcp.exe work/package-smoke
